name: Test Spreadsheet Preview

# The Excel line's acceptance, run against the SHIPPED Windows binary — the
# same pattern as the updater, swap-helper and OfficeCLI acceptances: manual,
# independent of the release pipeline, and what must be green before a dev
# build is promoted to stable (docs/specs/spreadsheet/product-contract.md §5
# in powerai-desktop).
#
# It downloads a published release's win-x64 zip, unpacks it, and drives the
# real app over CDP with the harness in powerai-desktop: a near-budget
# workbook must reach Univer, an over-budget workbook must reach the refusal
# page fast, an image-heavy small table must stay interactive, and a workbook
# with a link into another workbook must open with the external-reference
# notice and no engine errors persisted by an edit.
#
# A second lane drives the same binary through what a person does in the
# preview (tests/manual/spreadsheet-preview-fidelity in powerai-desktop):
# opening, looking around, no-op saves, undo/redo, typing, bold, paste,
# clearing, an agent write into the open workbook, a file changed underneath
# by another program, a sheet rename and a row insertion on a workbook with
# external links and pictures, and closing the tab with unsaved edits — each
# with the outcome it must produce: a patch, a cancellable warning, or an
# honest refusal.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release version to test (e.g. 0.1.34-dev.25)'
        required: true
        type: string
      desktop_ref:
        description: 'powerai-desktop ref whose harness to use (default: main)'
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  windows-spreadsheet-preview:
    name: Drive the shipped Windows app through the spreadsheet acceptance
    runs-on: windows-2025
    environment: release
    timeout-minutes: 40
    steps:
      - name: Checkout desktop harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ inputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install harness dependencies
        shell: pwsh
        working-directory: powerai-desktop
        run: bun install --frozen-lockfile

      - name: Download the published Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $asset = "PowerAI-$version-win-x64.zip"
          gh release download "v$version" --repo dztabel-happy/powerai-releases --pattern $asset --dir "$env:RUNNER_TEMP"
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $asset) -DestinationPath (Join-Path $env:RUNNER_TEMP 'app') -Force
          $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'app') -Filter PowerAI.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "PowerAI.exe not found in $asset" }
          "POWERAI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the spreadsheet acceptance against the shipped binary
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'spreadsheet-preview-acceptance'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          bun tests/manual/spreadsheet-preview-budget/verify.ts "--executable=$env:POWERAI_EXE" "--evidence=$(Join-Path $evidenceDir 'evidence.json')"

      - name: Run the preview fidelity acceptance against the shipped binary
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'spreadsheet-preview-acceptance'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          bunx tsx tests/manual/spreadsheet-preview-fidelity/drive.ts "--executable=$env:POWERAI_EXE" "--evidence=$(Join-Path $evidenceDir 'fidelity.json')" "--out=$(Join-Path $evidenceDir 'fidelity-shots')"

      - name: Retain acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spreadsheet-preview-acceptance-${{ inputs.version }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/spreadsheet-preview-acceptance/
