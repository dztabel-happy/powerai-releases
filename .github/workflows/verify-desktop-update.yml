name: Verify PowerAI Desktop Update

on:
  workflow_call:
    inputs:
      from_version:
        description: Installed public version before update
        required: true
        type: string
      to_version:
        description: Current latest public version after update
        required: true
        type: string
      desktop_ref:
        description: Exact 40-character private Desktop commit containing the acceptance harness
        required: true
        type: string
      arch:
        description: Windows architecture of both the published source and target
        required: true
        type: string
      require_windows_signature:
        description: Require source installer/application signatures (false for current unsigned Windows releases)
        required: false
        default: false
        type: boolean
      target_channel:
        description: Update channel selected by the installed source app
        required: true
        type: string
    outputs:
      accepted:
        description: True only after the installed update JSON passes all required checks
        value: ${{ jobs.windows-update.outputs.accepted }}
  workflow_dispatch:
    inputs:
      from_version:
        description: Installed public version before update
        required: true
        type: string
      to_version:
        description: Current latest public version after update
        required: true
        type: string
      desktop_ref:
        description: Exact 40-character private Desktop commit containing the acceptance harness
        required: true
        type: string
      arch:
        description: Windows architecture of both the published source and target
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
      require_windows_signature:
        description: Require source installer/application signatures (false for current unsigned Windows releases)
        required: false
        default: false
        type: boolean
      target_channel:
        description: Update channel selected by the installed source app
        required: true
        default: stable
        type: choice
        options:
          - stable
          - dev

permissions:
  contents: read

concurrency:
  group: powerai-update-${{ inputs.arch }}-${{ inputs.target_channel }}-${{ inputs.from_version }}-${{ inputs.to_version }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: dztabel-happy/powerai-releases

jobs:
  windows-update:
    name: Windows ${{ inputs.arch }} installed update
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    environment: release
    timeout-minutes: 30
    outputs:
      accepted: ${{ steps.acceptance.outputs.accepted || 'false' }}
    env:
      FROM_VERSION: ${{ inputs.from_version }}
      TO_VERSION: ${{ inputs.to_version }}
      TARGET_CHANNEL: ${{ inputs.target_channel }}
      TARGET_ARCH: ${{ inputs.arch }}
      DESKTOP_REF: ${{ inputs.desktop_ref }}
      REQUIRE_WINDOWS_SIGNATURE: ${{ inputs.require_windows_signature }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [[ "$DESKTOP_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$FROM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || exit 1
          [[ "$TO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || exit 1
          [[ "$TARGET_CHANNEL" = stable || "$TARGET_CHANNEL" = dev ]] || exit 1
          [[ "$TARGET_ARCH" = x64 || "$TARGET_ARCH" = arm64 ]] || exit 1
          transition=none
          if [[ "$TARGET_CHANNEL" = dev && "$FROM_VERSION" != *-dev.* ]]; then
            transition=stable-to-dev
          fi
          echo "CHANNEL_TRANSITION=$transition" >> "$GITHUB_ENV"

      - name: Require private harness deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Private Desktop deploy key is unavailable.' >&2; exit 1; }

      - name: Restrict ARM64 runner temporary directory permissions
        if: inputs.arch == 'arm64'
        shell: pwsh
        run: |
          # Match the native ARM build lane: OpenSSH must not inherit broad
          # access to its temporary checkout key from this runner directory.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $env:RUNNER_TEMP /inheritance:r /grant:r "*${sid}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls $env:RUNNER_TEMP /remove:g '*S-1-5-11' '*S-1-5-32-545'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout exact private Desktop harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ inputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          persist-credentials: false
          path: powerai-desktop
          fetch-depth: 1

      - name: Verify harness commit
        shell: bash
        run: |
          test "$(git -C powerai-desktop rev-parse HEAD)" = "$DESKTOP_REF"
          echo "Acceptance harness: $DESKTOP_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node for installed executable checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install private harness dependencies
        working-directory: powerai-desktop
        run: bun install --frozen-lockfile

      - name: Require published versions and the current channel target
        shell: pwsh
        working-directory: powerai-desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $catalog = Join-Path $env:RUNNER_TEMP 'published-releases.json'
          gh api "repos/$env:RELEASE_REPOSITORY/releases?per_page=100" --paginate --slurp > $catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/manual/auto-update/validate-release.mjs $catalog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download source installer and published provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\download" | Out-Null
          gh release download "v$env:FROM_VERSION" --repo $env:RELEASE_REPOSITORY --pattern "PowerAI-$($env:FROM_VERSION)-win-$($env:TARGET_ARCH).exe" --dir "$env:RUNNER_TEMP\download"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "v$env:FROM_VERSION" --repo $env:RELEASE_REPOSITORY --pattern 'release-provenance.json' --dir "$env:RUNNER_TEMP\download"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source installer against published provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'download');
          const name = `PowerAI-${process.env.FROM_VERSION}-win-${process.env.TARGET_ARCH}.exe`;
          const provenanceBytes = fs.readFileSync(path.join(directory, 'release-provenance.json'));
          const provenance = JSON.parse(provenanceBytes);
          assert.equal(provenance.schemaVersion, 1, 'Unsupported source provenance schema');
          assert.equal(provenance.version, process.env.FROM_VERSION, 'Source provenance version mismatch');
          const expectedSha256 = provenance.assets?.[name];
          assert.match(expectedSha256 ?? '', /^[a-f0-9]{64}$/, 'Source installer digest is missing or invalid');
          const hash = crypto.createHash('sha256');
          for await (const chunk of fs.createReadStream(path.join(directory, name))) hash.update(chunk);
          const actualSha256 = hash.digest('hex');
          assert.equal(actualSha256, expectedSha256, 'Source installer SHA-256 does not match published provenance');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'source-installer-integrity.json'), JSON.stringify({
            verified: true, version: provenance.version, arch: process.env.TARGET_ARCH,
            name, expectedSha256, actualSha256,
            size: fs.statSync(path.join(directory, name)).size,
            provenanceSha256: crypto.createHash('sha256').update(provenanceBytes).digest('hex'),
            desktopCommit: provenance.desktopCommit, agentCommit: provenance.agentCommit,
            workflowRun: provenance.workflowRun,
          }, null, 2) + '\n');
          NODE

      - name: Install source version
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\download\PowerAI-$($env:FROM_VERSION)-win-$($env:TARGET_ARCH).exe"
          if ($env:REQUIRE_WINDOWS_SIGNATURE -eq 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
          }
          $installDir = "$env:RUNNER_TEMP\PowerAI"
          $installation = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/S', "/D=$installDir"
          if ($installation.ExitCode -ne 0) { throw "Source installer exited with $($installation.ExitCode)" }
          if (-not (Test-Path -LiteralPath "$installDir\PowerAI.exe")) { throw "Source executable is missing: $installDir\PowerAI.exe" }
          if ($env:REQUIRE_WINDOWS_SIGNATURE -eq 'true') {
            $installedSignature = Get-AuthenticodeSignature -LiteralPath "$installDir\PowerAI.exe"
            if ($installedSignature.Status -ne 'Valid') { throw "Installed signature is $($installedSignature.Status)" }
          }

      - name: Exercise old to new update
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          node tests/manual/auto-update/verify.mjs `
            "--executable=$env:RUNNER_TEMP\PowerAI\PowerAI.exe" `
            "--user-data-dir=$env:RUNNER_TEMP\user-data" `
            "--from=$env:FROM_VERSION" `
            "--to=$env:TO_VERSION" `
            "--arch=$env:TARGET_ARCH" `
            "--channel-transition=$env:CHANNEL_TRANSITION" `
            "--evidence=$env:RUNNER_TEMP\update-acceptance-windows-$env:TARGET_ARCH.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installed update evidence
        id: acceptance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.RUNNER_TEMP, `update-acceptance-windows-${process.env.TARGET_ARCH}.json`);
          const bytes = fs.readFileSync(file);
          const evidence = JSON.parse(bytes);
          const integrity = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'source-installer-integrity.json')));
          assert.equal(integrity.verified, true, 'Source installer digest was not verified');
          assert.equal(integrity.version, process.env.FROM_VERSION);
          assert.equal(integrity.arch, process.env.TARGET_ARCH);
          for (const [key, expected] of Object.entries({
            fromVersion: process.env.FROM_VERSION, toVersion: process.env.TO_VERSION,
            installedVersion: process.env.TO_VERSION, platform: 'win32',
            expectedArch: process.env.TARGET_ARCH, sourceExecutableArch: process.env.TARGET_ARCH,
            installedExecutableArch: process.env.TARGET_ARCH, harnessCommit: process.env.DESKTOP_REF,
            channelTransition: process.env.CHANNEL_TRANSITION, relaunchMode: 'controlled',
            expectedRoute: 'any', firstAutomaticRelaunch: false, sourceExitCode: 0,
            updateInstallerExited: true, userDataRetained: true, noRestartLoop: true,
          })) assert.equal(evidence[key], expected, `Acceptance evidence mismatch: ${key}`);
          if (process.env.CHANNEL_TRANSITION === 'stable-to-dev') {
            assert.equal(evidence.prereleaseEnabledWithoutRestart, true, 'Dev channel transition did not pass');
            assert.equal(evidence.discoveredVersion, process.env.TO_VERSION, 'Dev channel discovered the wrong version');
          }
          assert.equal(evidence.documentEngine?.pdfConversion, true, 'Real PDF conversion did not pass');
          assert.ok(!evidence.error && !evidence.failedAt && !evidence.routeDiagnosticError, 'Acceptance recorded a failure');
          assert.ok(Number.isFinite(Date.parse(evidence.startedAt)) &&
            Number.isFinite(Date.parse(evidence.completedAt)) &&
            Date.parse(evidence.completedAt) >= Date.parse(evidence.startedAt), 'Acceptance did not complete');
          assert.ok(['staged', 'nsis', 'unknown'].includes(evidence.updateRoute?.route), 'Invalid or conflicting update route');
          const titlebar = evidence.windowsTitlebar;
          assert.ok(titlebar && ['reservedWidth', 'safeRight', 'paddingRight', 'interactiveRight']
            .every((key) => Number.isFinite(titlebar[key])), 'Titlebar checks are missing');
          assert.ok(titlebar.reservedWidth > 0 && titlebar.paddingRight >= titlebar.reservedWidth &&
            titlebar.interactiveRight <= titlebar.safeRight, 'Titlebar safe area check did not pass');
          const summary = {
            accepted: true, fromVersion: evidence.fromVersion, toVersion: evidence.toVersion,
            channel: process.env.TARGET_CHANNEL, channelTransition: evidence.channelTransition, arch: evidence.expectedArch,
            harnessCommit: evidence.harnessCommit, completedAt: evidence.completedAt,
            relaunchMode: evidence.relaunchMode, firstAutomaticRelaunch: false,
            updateRoute: evidence.updateRoute, sourceInstaller: integrity,
            userDataRetained: true, noRestartLoop: true, pdfConversion: true, titlebarPassed: true,
            evidenceSha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            boundaries: ['Controlled relaunch does not verify the first automatic target launch.',
              'Source installer digest verification does not measure installed source/target payload hashes.'],
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'installed-update-summary.json'), JSON.stringify(summary, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Installed update accepted\n${summary.fromVersion} → ${summary.toVersion} (${summary.arch}, ${summary.channel})\n\n` +
            `Route: ${summary.updateRoute.route}; relaunch: controlled; first automatic launch: unverified.\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'accepted=true\n');
          NODE

      - name: Print installed update evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "update-acceptance-windows-$env:TARGET_ARCH.json"
          if (Test-Path $evidence) {
            $result = Get-Content -Raw $evidence
            Write-Host $result
            '### Installed Windows update evidence' >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            $result >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          else { Write-Host 'Installed update evidence was not written.' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: update-acceptance-windows-${{ inputs.arch }}-${{ inputs.target_channel }}-${{ inputs.from_version }}-${{ inputs.to_version }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/update-acceptance-windows-${{ inputs.arch }}.json
            ${{ runner.temp }}/update-acceptance-windows-${{ inputs.arch }}.json.diagnostics/
            ${{ runner.temp }}/installed-update-summary.json
            ${{ runner.temp }}/source-installer-integrity.json
            ${{ runner.temp }}/download/release-provenance.json
