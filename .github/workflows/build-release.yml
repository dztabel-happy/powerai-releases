name: Build PowerAI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version
        required: true
        type: string
      desktop_ref:
        description: Exact 40-character desktop main commit
        required: true
        type: string
      agent_ref:
        description: Exact 40-character agent main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: powerai-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.13

jobs:
  guard:
    name: Validate immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release inputs
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$DESKTOP_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AGENT_REF" =~ ^[0-9a-f]{40}$ ]]
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "const a=process.argv[1].split(/[.-]/).slice(0,3).map(Number); const b=process.argv[2].slice(1).split('.').map(Number); if(!a.some((value,index)=>value!==b[index]&&value>b[index]&&a.slice(0,index).every((part,i)=>part===b[i]))) process.exit(1)" "$VERSION" "$previous_tag"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  approve:
    name: Approve immutable release
    needs: guard
    runs-on: ubuntu-24.04
    environment: release-approval
    timeout-minutes: 5
    steps:
      - run: echo 'Release approved'

  windows-x64:
    name: Build unsigned Windows x64
    needs: [guard, approve]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 90
    steps:
      - name: Checkout exact desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ inputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Checkout exact agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-agent
          ref: ${{ inputs.agent_ref }}
          ssh-key: ${{ secrets.POWERAI_AGENT_DEPLOY_KEY }}
          path: powerai-agent
          fetch-depth: 1

      - name: Validate exact main commits
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          set -euo pipefail
          test "$(git -C powerai-desktop rev-parse HEAD)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent rev-parse HEAD)" = "$AGENT_REF"
          test "$(git -C powerai-desktop ls-remote origin refs/heads/main | cut -f1)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent ls-remote origin refs/heads/main | cut -f1)" = "$AGENT_REF"
          node -e "const fs=require('fs'); const file='powerai-desktop/package.json'; const value=JSON.parse(fs.readFileSync(file)); value.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(value, null, 2)+'\n')"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build native agent
        shell: bash
        run: |
          bun install --cwd powerai-agent --filter './packages/opencode' --filter './packages/app' --frozen-lockfile
          bun run --cwd powerai-agent/packages/opencode build -- --single --skip-install

      - name: Install desktop dependencies
        shell: bash
        run: bun install --cwd powerai-desktop --frozen-lockfile

      - name: Prepare checksum-verified Electron distribution
        shell: bash
        run: |
          electron_dist="$(cd powerai-desktop && node scripts/release/prepare-electron.mjs win32 x64 "$RUNNER_TEMP/electron")"
          echo "ELECTRON_DIST_PATH=$electron_dist" >> "$GITHUB_ENV"

      - name: Build unsigned Windows installer
        working-directory: powerai-desktop
        env:
          CI: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build-win:x64

      - name: Verify Windows artifacts
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          node scripts/release/verify-native-module.mjs --app out/win-unpacked/PowerAI.exe
          $installer = 'out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe'
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'NotSigned') { throw 'Expected unsigned internal installer' }

      - name: Retain Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            powerai-desktop/out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe
            powerai-desktop/out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe.blockmap
            powerai-desktop/out/latest.yml

  publish-windows:
    name: Verify and publish Windows x64
    needs: [guard, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64
          path: build-artifacts/windows-x64

      - name: Validate exact release bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          set -euo pipefail
          node scripts/windows-release.mjs prepare build-artifacts "$RUNNER_TEMP/release-assets" "$VERSION"
          node scripts/windows-release.mjs provenance \
            "$RUNNER_TEMP/release-assets" \
            "$VERSION" \
            "$DESKTOP_REF" \
            "$AGENT_REF" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node scripts/windows-release.mjs verify "$RUNNER_TEMP/release-assets" "$VERSION"

      - name: Publish only after byte-for-byte verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_created=false
          cleanup() {
            if [ "$release_created" = true ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap cleanup ERR
          printf 'PowerAI %s Windows x64 internal test build. The installer is unsigned.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target main --title "PowerAI $tag" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/release-assets"/*
          release_created=true
          mkdir -p "$RUNNER_TEMP/remote-check"
          while IFS= read -r file; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$file")" --dir "$RUNNER_TEMP/remote-check"
          done < <(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | sort)
          (cd "$RUNNER_TEMP/release-assets" && sha256sum * | sort -k2) > "$RUNNER_TEMP/local-hashes.txt"
          (cd "$RUNNER_TEMP/remote-check" && sha256sum * | sort -k2) > "$RUNNER_TEMP/remote-hashes.txt"
          diff -u "$RUNNER_TEMP/local-hashes.txt" "$RUNNER_TEMP/remote-hashes.txt"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          release_created=false
