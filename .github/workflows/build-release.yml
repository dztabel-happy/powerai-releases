name: Build PowerAI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version
        required: true
        type: string
      desktop_ref:
        description: Exact 40-character desktop main commit
        required: true
        type: string
      agent_ref:
        description: Exact 40-character agent main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: powerai-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.13

jobs:
  guard:
    name: Validate immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release inputs
        id: inputs
        env:
          VERSION: ${{ inputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$DESKTOP_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AGENT_REF" =~ ^[0-9a-f]{40}$ ]]
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "const a=process.argv[1].split(/[.-]/).slice(0,3).map(Number); const b=process.argv[2].slice(1).split('.').map(Number); if(!a.some((value,index)=>value!==b[index]&&value>b[index]&&a.slice(0,index).every((part,i)=>part===b[i]))) process.exit(1)" "$VERSION" "$previous_tag"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  approve:
    name: Approve immutable release
    needs: guard
    runs-on: ubuntu-24.04
    environment: release-approval
    timeout-minutes: 5
    steps:
      - run: echo 'Release approved'

  windows-x64:
    name: Build unsigned Windows x64
    needs: [guard, approve]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 150
    steps:
      - name: Checkout exact desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ inputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Checkout exact agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-agent
          ref: ${{ inputs.agent_ref }}
          ssh-key: ${{ secrets.POWERAI_AGENT_DEPLOY_KEY }}
          path: powerai-agent
          fetch-depth: 1

      - name: Validate exact main commits
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          set -euo pipefail
          test "$(git -C powerai-desktop rev-parse HEAD)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent rev-parse HEAD)" = "$AGENT_REF"
          test "$(git -C powerai-desktop ls-remote origin refs/heads/main | cut -f1)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent ls-remote origin refs/heads/main | cut -f1)" = "$AGENT_REF"
          node -e "const fs=require('fs'); const file='powerai-desktop/package.json'; const value=JSON.parse(fs.readFileSync(file)); value.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(value, null, 2)+'\n')"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build native agent
        shell: bash
        run: |
          bun install --cwd powerai-agent --filter './packages/opencode' --filter './packages/app' --frozen-lockfile
          bun run --cwd powerai-agent/packages/opencode build -- --single --skip-install

      - name: Install desktop dependencies
        shell: bash
        run: bun install --cwd powerai-desktop --frozen-lockfile

      - name: Prepare checksum-verified Electron distribution
        shell: bash
        run: |
          electron_dist="$(cd powerai-desktop && node scripts/release/prepare-electron.mjs win32 x64 "$RUNNER_TEMP/electron")"
          echo "ELECTRON_DIST_PATH=$electron_dist" >> "$GITHUB_ENV"

      - name: Build unsigned Windows installer
        working-directory: powerai-desktop
        env:
          CI: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build-win:x64

      - name: Verify Windows artifacts
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          node scripts/release/verify-native-module.mjs --app out/win-unpacked/PowerAI.exe
          $installer = 'out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe'
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'NotSigned') { throw 'Expected unsigned internal installer' }

      # Promoted back to a blocking gate after the agreed two consecutive
      # green advisory runs (v0.1.34-dev.26 and dev.27). A failure here now
      # stops the release; the evidence artifact below carries the state
      # snapshot, screenshot and app log for diagnosis.
      - name: Verify packaged spreadsheet preview budget
        id: spreadsheet_budget
        shell: pwsh
        working-directory: powerai-desktop
        run: |
          $executable = (Resolve-Path 'out/win-unpacked/PowerAI.exe').Path
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'spreadsheet-preview-budget-windows'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $evidence = Join-Path $evidenceDir 'evidence.json'
          bun tests/manual/spreadsheet-preview-budget/verify.ts "--executable=$executable" "--evidence=$evidence"

      - name: Retain spreadsheet preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spreadsheet-preview-budget-windows
          if-no-files-found: warn
          retention-days: 3
          path: ${{ runner.temp }}/spreadsheet-preview-budget-windows/

      - name: Check real model image credentials
        id: image_credentials
        shell: pwsh
        env:
          POWERAI_SMOKE_API_KEY: ${{ secrets.POWERAI_SMOKE_API_KEY }}
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'image-model-smoke-windows'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:POWERAI_SMOKE_API_KEY)) {
            'available=false' >> $env:GITHUB_OUTPUT
            $reason = 'POWERAI_SMOKE_API_KEY is missing; real model image acceptance was NOT run.'
            Write-Host "::warning::SKIPPED: $reason"
            "Image model smoke: SKIPPED — $reason" >> $env:GITHUB_STEP_SUMMARY
            @{ status = 'skipped'; passed = $false; reason = $reason } | ConvertTo-Json | Set-Content (Join-Path $evidenceDir 'evidence.json')
          } else {
            'available=true' >> $env:GITHUB_OUTPUT
          }

      - name: Verify packaged real model image turn
        if: steps.image_credentials.outputs.available == 'true'
        timeout-minutes: 5
        shell: pwsh
        working-directory: powerai-desktop
        env:
          POWERAI_SMOKE_API_KEY: ${{ secrets.POWERAI_SMOKE_API_KEY }}
        run: |
          $agent = (Resolve-Path 'out/win-unpacked/resources/bundled-powerai-agent/win32-x64/powerai-agent.exe').Path
          $evidence = Join-Path $env:RUNNER_TEMP 'image-model-smoke-windows/evidence.json'
          bun tests/manual/image-model-smoke/verify.ts "--agent=$agent" "--evidence=$evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Image model smoke: PASSED — all four image codes verified.' >> $env:GITHUB_STEP_SUMMARY

      - name: Retain real model image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-model-smoke-windows
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ runner.temp }}/image-model-smoke-windows/evidence.json
            ${{ runner.temp }}/image-model-smoke-windows/config.json
            ${{ runner.temp }}/image-model-smoke-windows/run-config.json
            ${{ runner.temp }}/image-model-smoke-windows/events.json
            ${{ runner.temp }}/image-model-smoke-windows/stderr.log

      # Failure continuity acceptance drives the packaged Desktop and its bundled
      # Agent through injected provider/runtime/desktop/disk failures and checks
      # that every case terminates visibly, keeps its transcript, resumes the same
      # durable session and answers the next message. It needs the real gateway
      # credential and the harness shipped with the desktop commit. Promoted to
      # a blocking gate after three consecutive green advisory runs (the
      # v0.1.39-dev.10, dev.11 and dev.12 builds), like the spreadsheet budget
      # lane above: a failure here now stops the release, and the evidence
      # artifact below carries every case's state for diagnosis.
      - name: Check failure continuity acceptance prerequisites
        id: failure_continuity
        shell: pwsh
        env:
          POWERAI_SMOKE_API_KEY: ${{ secrets.POWERAI_SMOKE_API_KEY }}
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'failure-continuity-windows'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $reason = $null
          if (-not (Test-Path 'powerai-desktop/tests/manual/failure-continuity/matrix.ts')) {
            $reason = 'The desktop commit does not ship tests/manual/failure-continuity; packaged failure continuity acceptance was NOT run.'
          } elseif ([string]::IsNullOrWhiteSpace($env:POWERAI_SMOKE_API_KEY)) {
            $reason = 'POWERAI_SMOKE_API_KEY is missing; packaged failure continuity acceptance was NOT run.'
          }
          if ($reason) {
            'available=false' >> $env:GITHUB_OUTPUT
            Write-Host "::warning::SKIPPED: $reason"
            "Failure continuity: SKIPPED — $reason" >> $env:GITHUB_STEP_SUMMARY
            @{ status = 'skipped'; passed = $false; reason = $reason } | ConvertTo-Json | Set-Content (Join-Path $evidenceDir 'matrix.json')
          } else {
            'available=true' >> $env:GITHUB_OUTPUT
          }

      - name: Set up Node for packaged acceptance drivers
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Exercise actual Windows WCO geometry and hit-testing before publication.
      # This shares the same driver used locally on macOS; no gateway is needed.
      - name: Verify packaged titlebar and panel layout
        timeout-minutes: 15
        shell: pwsh
        working-directory: powerai-desktop
        env:
          POWERAI_P0_ENGINE_CACHE: ${{ runner.temp }}\powerai-p0-engine
        run: |
          $env:POWERAI_BINARY = (Resolve-Path 'out/win-unpacked/PowerAI.exe').Path
          $env:PANEL_ACCEPTANCE_OUT = Join-Path $env:RUNNER_TEMP 'titlebar-windows'
          node --import tsx tests/manual/layout-panel-system/drive-titlebar.ts
          if ($LASTEXITCODE -ne 0) {
            'Titlebar layout: FAILED — publication is blocked; see titlebar-windows.' >> $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
          'Titlebar layout: PASSED — home, conversation, sidebar animation and extensions on native Windows.' >> $env:GITHUB_STEP_SUMMARY

      - name: Retain titlebar layout evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: titlebar-windows
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/titlebar-windows/

      - name: Verify packaged failure continuity
        id: failure_continuity_matrix
        if: steps.failure_continuity.outputs.available == 'true'
        timeout-minutes: 75
        shell: pwsh
        working-directory: powerai-desktop
        env:
          POWERAI_SMOKE_API_KEY: ${{ secrets.POWERAI_SMOKE_API_KEY }}
          # One managed LibreOffice download per run; later cases mount it.
          POWERAI_P0_ENGINE_CACHE: ${{ runner.temp }}\powerai-p0-engine
        run: |
          $executable = (Resolve-Path 'out/win-unpacked/PowerAI.exe').Path
          $evidence = Join-Path $env:RUNNER_TEMP 'failure-continuity-windows'
          node --import tsx tests/manual/failure-continuity/matrix.ts "--app=$executable" "--evidence=$evidence" --workers=2
          if ($LASTEXITCODE -ne 0) {
            "Failure continuity: FAILED — the release stops here; see the failure-continuity-windows artifact, matrix.json lists every case." >> $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
          'Failure continuity: PASSED — packaged Windows matrix green.' >> $env:GITHUB_STEP_SUMMARY

      # A timed-out or crashed case can leave product processes holding files
      # under the evidence directory; stop only those (matched by command
      # line, never by bare name) so the upload cannot fail on a locked file.
      - name: Release failure continuity evidence locks
        if: always() && steps.failure_continuity.outputs.available == 'true'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'failure-continuity-windows'
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine -match [regex]::Escape($evidence) } | ForEach-Object {
            Write-Host "Stopping leftover process $($_.ProcessId): $($_.Name)"
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }

      - name: Retain failure continuity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: failure-continuity-windows
          if-no-files-found: warn
          retention-days: 3
          path: ${{ runner.temp }}/failure-continuity-windows/

      - name: Retain Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            powerai-desktop/out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe
            powerai-desktop/out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.exe.blockmap
            powerai-desktop/out/PowerAI-${{ needs.guard.outputs.version }}-win-x64.zip
            powerai-desktop/out/latest.yml

  macos-arm64:
    name: Build and submit macOS arm64
    needs: [guard, approve]
    runs-on: macos-14
    environment: release
    timeout-minutes: 90
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: release-tools

      - name: Checkout exact desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ inputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Checkout exact agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-agent
          ref: ${{ inputs.agent_ref }}
          ssh-key: ${{ secrets.POWERAI_AGENT_DEPLOY_KEY }}
          path: powerai-agent
          fetch-depth: 1

      - name: Validate exact main commits
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          set -euo pipefail
          test "$(git -C powerai-desktop rev-parse HEAD)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent rev-parse HEAD)" = "$AGENT_REF"
          test "$(git -C powerai-desktop ls-remote origin refs/heads/main | cut -f1)" = "$DESKTOP_REF"
          test "$(git -C powerai-agent ls-remote origin refs/heads/main | cut -f1)" = "$AGENT_REF"
          node -e "const fs=require('fs'); const file='powerai-desktop/package.json'; const value=JSON.parse(fs.readFileSync(file)); value.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(value, null, 2)+'\n')"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build native agent
        run: |
          bun install --cwd powerai-agent --filter './packages/opencode' --filter './packages/app' --frozen-lockfile
          bun run --cwd powerai-agent/packages/opencode build -- --single --skip-install

      - name: Install desktop dependencies
        run: bun install --cwd powerai-desktop --frozen-lockfile

      - name: Prepare checksum-verified Electron distribution
        run: |
          electron_dist="$(cd powerai-desktop && node scripts/release/prepare-electron.mjs darwin arm64 "$RUNNER_TEMP/electron")"
          echo "ELECTRON_DIST_PATH=$electron_dist" >> "$GITHUB_ENV"

      - name: Prepare Apple credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_KEY_ISSUER:?Missing APPLE_API_KEY_ISSUER}"
          : "${MAC_CSC_LINK:?Missing MAC_CSC_LINK}"
          : "${MAC_CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed macOS app
        working-directory: powerai-desktop
        env:
          CI: "true"
          POWERAI_RELEASE_BUILD: "1"
          POWERAI_NOTARIZATION_MODE: deferred
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build-mac:arm64

      - name: Submit app without waiting
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          app="powerai-desktop/out/mac-arm64/PowerAI.app"
          pending="$RUNNER_TEMP/PowerAI-app-pending.zip"
          codesign --verify --deep --strict --verbose=2 "$app"
          node powerai-desktop/scripts/release/verify-native-module.mjs --app "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$pending"
          xcrun notarytool submit "$pending" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --output-format json > "$RUNNER_TEMP/notary-submit.json"
          submission_id="$(node -e "const value=require(process.argv[1]); if(!/^[0-9a-f-]{36}$/.test(value.id)) process.exit(1); process.stdout.write(value.id)" "$RUNNER_TEMP/notary-submit.json")"
          node release-tools/scripts/release-state.mjs create \
            "$RUNNER_TEMP/notary-state.json" \
            "$VERSION" \
            "$DESKTOP_REF" \
            "$AGENT_REF" \
            "$submission_id" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Retain pending macOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-pending
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/PowerAI-app-pending.zip
            ${{ runner.temp }}/notary-state.json

  mark-macos-pending:
    name: Mark the release as awaiting notarization
    needs: [guard, macos-arm64, publish-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download notarization state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-pending
          path: pending

      # The published Windows release carries the pending marker so the
      # finalizer can find it later. Apple's queue is unbounded, so the
      # macOS lane never gates the Windows publish — the marker is how the
      # two lanes rejoin once Apple answers.
      - name: Attach the pending marker
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" pending/notary-state.json --clobber

  publish-windows:
    name: Verify and publish Windows x64
    needs: [guard, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x64
          path: build-artifacts/windows-x64

      - name: Validate exact release bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DESKTOP_REF: ${{ inputs.desktop_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
        run: |
          set -euo pipefail
          node scripts/windows-release.mjs prepare build-artifacts "$RUNNER_TEMP/release-assets" "$VERSION"
          node scripts/windows-release.mjs provenance \
            "$RUNNER_TEMP/release-assets" \
            "$VERSION" \
            "$DESKTOP_REF" \
            "$AGENT_REF" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node scripts/windows-release.mjs verify "$RUNNER_TEMP/release-assets" "$VERSION"

      - name: Publish only after byte-for-byte verification
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_created=false
          cleanup() {
            if [ "$release_created" = true ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap cleanup ERR
          if [[ "$VERSION" == *-* ]]; then
            printf 'PowerAI %s Windows x64 DEV build (prerelease). Only clients that opted into prerelease updates receive it. The installer is unsigned.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          else
            printf 'PowerAI %s Windows x64 stable release — every client receives it through automatic updates. The installer is unsigned.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target main --title "PowerAI $tag" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/release-assets"/*
          release_created=true
          mkdir -p "$RUNNER_TEMP/remote-check"
          while IFS= read -r file; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$file")" --dir "$RUNNER_TEMP/remote-check"
          done < <(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | sort)
          (cd "$RUNNER_TEMP/release-assets" && sha256sum * | sort -k2) > "$RUNNER_TEMP/local-hashes.txt"
          (cd "$RUNNER_TEMP/remote-check" && sha256sum * | sort -k2) > "$RUNNER_TEMP/remote-hashes.txt"
          diff -u "$RUNNER_TEMP/local-hashes.txt" "$RUNNER_TEMP/remote-hashes.txt"
          # A dev build is a prerelease: it must never take the "latest"
          # pointer, which is what unopted clients and the mirror follow.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          release_created=false
