name: Finalize Apple Notarization

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact pending version
        required: false
        type: string
  schedule:
    # Apple's queue is unbounded; polling is how the macOS lane rejoins a
    # release that already shipped Windows.
    - cron: "17,47 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: powerai-notarization-finalizer
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.13

jobs:
  finalize:
    name: Poll and finalize pending release
    runs-on: macos-14
    environment: release
    timeout-minutes: 60
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare Apple credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_KEY_ISSUER:?Missing APPLE_API_KEY_ISSUER}"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import the signing identity
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MAC_CSC_LINK:?Missing MAC_CSC_LINK}"
          : "${MAC_CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          # A notarization ticket is not a signature: Gatekeeper assesses a
          # downloaded disk image against its primary signature, and
          # electron-builder does not sign the container. So this job signs the
          # dmg itself, which means it needs a keychain — it never had one.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CSC_LINK" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Find pending release and query Apple
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            candidates="v$REQUESTED_VERSION"
          else
            # Windows now publishes immediately, so a pending release is a
            # PUBLISHED one carrying the notary-state.json marker. Consider
            # every one of them: a newer release sitting In Progress must not
            # starve an older one Apple already answered, or that older app
            # ages out of its 14-day artifact retention while first in line.
            candidates="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select([.assets[].name] | index("notary-state.json")) | .tag_name')"
          fi
          if [ -z "$candidates" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pending"
          # Every terminal outcome must drop the marker. The poller runs on a
          # schedule, so a marker left behind on a release it can never
          # finish turns into a failure every 30 minutes, forever.
          drop_marker() {
            asset_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .assets[] | select(.name == \"notary-state.json\") | .id")"
            if [ -n "$asset_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; fi
          }
          for tag in $candidates; do
          rm -f "$RUNNER_TEMP/pending/notary-state.json"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern notary-state.json --dir "$RUNNER_TEMP/pending"
          node scripts/release-state.mjs verify "$RUNNER_TEMP/pending/notary-state.json"
          version="$(node scripts/release-state.mjs get "$RUNNER_TEMP/pending/notary-state.json" version)"
          test "$tag" = "v$version"
          submission_id="$(node scripts/release-state.mjs get "$RUNNER_TEMP/pending/notary-state.json" submissionId)"
          xcrun notarytool info "$submission_id" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --output-format json > "$RUNNER_TEMP/pending/notary-info.json"
          status="$(node -e "const value=require(process.argv[1]); process.stdout.write(value.status)" "$RUNNER_TEMP/pending/notary-info.json")"
          if [ "$status" = 'In Progress' ]; then
            # Still waiting on Apple. Look at the next pending release rather
            # than giving up on the whole poll.
            continue
          fi
          if [ "$status" = 'Invalid' ]; then
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" \
              "$RUNNER_TEMP/pending/notary-log.json"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/pending/notary-log.json" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "PowerAI $tag (notarization failed)"
            drop_marker
            exit 1
          fi
          test "$status" = 'Accepted'
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "desktop_ref=$(node scripts/release-state.mjs get "$RUNNER_TEMP/pending/notary-state.json" desktopCommit)" >> "$GITHUB_OUTPUT"
          echo "agent_ref=$(node scripts/release-state.mjs get "$RUNNER_TEMP/pending/notary-state.json" agentCommit)" >> "$GITHUB_OUTPUT"
          build_url="$(node scripts/release-state.mjs get "$RUNNER_TEMP/pending/notary-state.json" buildUrl)"
          echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
          echo "build_run_id=${build_url##*/}" >> "$GITHUB_OUTPUT"
          exit 0
          done
          # Every pending release is still waiting on Apple.
          echo 'found=false' >> "$GITHUB_OUTPUT"

      - name: Checkout exact desktop source
        if: steps.pending.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: ${{ steps.pending.outputs.desktop_ref }}
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Set up Bun
        if: steps.pending.outputs.found == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install packaging dependencies
        if: steps.pending.outputs.found == 'true'
        run: bun install --cwd powerai-desktop --frozen-lockfile

      - name: Download the submitted app from its build run
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.pending.outputs.build_run_id }}
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          set -euo pipefail
          # A separate directory: this artifact also carries a notary-state.json,
          # and gh refuses to overwrite the marker already downloaded above.
          artifact_dir="$RUNNER_TEMP/submitted"
          mkdir -p "$artifact_dir"
          # Expiry is a fact the API states; a download can fail for many other
          # reasons, and treating those as expiry would abandon a release Apple
          # actually accepted.
          expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "macos-pending")] | if length == 0 then "gone" else (.[0].expired | tostring) end')"
          if [ "$expired" != 'false' ]; then
            # The signed app is kept for 14 days. Past that this release can
            # never be completed — say so once and drop the marker rather than
            # failing on every poll from now on.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "PowerAI $TAG (macOS artifact expired)"
            asset_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"notary-state.json\") | .id")"
            if [ -n "$asset_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; fi
            exit 1
          fi
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos-pending --dir "$artifact_dir"
          test -f "$artifact_dir/PowerAI-app-pending.zip"

      - name: Staple app and rebuild macOS update assets
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.pending.outputs.version }}
          # The disk image gets its own notarization in this step, so it needs
          # the same credentials the polling step used. APPLE_API_KEY_PATH
          # already arrives through GITHUB_ENV; the key id and issuer do not.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-app" "$RUNNER_TEMP/final-mac"
          ditto -x -k "$RUNNER_TEMP/submitted/PowerAI-app-pending.zip" "$RUNNER_TEMP/final-app"
          app="$RUNNER_TEMP/final-app/PowerAI.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          node powerai-desktop/scripts/release/verify-native-module.mjs --app "$app"
          node -e "const fs=require('fs'); const file='powerai-desktop/package.json'; const value=JSON.parse(fs.readFileSync(file)); value.version=process.env.VERSION; fs.writeFileSync(file, JSON.stringify(value, null, 2)+'\n')"
          (
            cd powerai-desktop
            CSC_IDENTITY_AUTO_DISCOVERY=false bunx electron-builder \
              --mac dmg zip \
              --arm64 \
              --prepackaged "$app" \
              --publish never \
              --config.directories.output="$RUNNER_TEMP/final-mac"
          )
          # The app inside is notarized and stapled, but a downloaded disk image
          # is assessed on its own — and electron-builder does not sign the
          # container (verified: `code object is not signed at all`). So the
          # dmg gets its own notarization. This one is fast: the notary service
          # has already scanned the payload, and unlike the first submission
          # there is nothing to gain by deferring a wait that ends in minutes.
          # A timeout here simply fails the run; the marker survives and the
          # next poll redoes this idempotently.
          codesign --force --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            "$RUNNER_TEMP/final-mac/PowerAI-$VERSION-mac-arm64.dmg"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/final-mac/PowerAI-$VERSION-mac-arm64.dmg"
          xcrun notarytool submit "$RUNNER_TEMP/final-mac/PowerAI-$VERSION-mac-arm64.dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          dmg_status="$(node -e "const value=require(process.argv[1]); process.stdout.write(value.status)" "$RUNNER_TEMP/dmg-notary.json")"
          if [ "$dmg_status" != 'Accepted' ]; then
            xcrun notarytool log \
              "$(node -e "const value=require(process.argv[1]); process.stdout.write(value.id)" "$RUNNER_TEMP/dmg-notary.json")" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" \
              "$RUNNER_TEMP/dmg-notary-log.json" || true
            cat "$RUNNER_TEMP/dmg-notary-log.json" || true
            echo "Disk image notarization returned $dmg_status" >&2
            exit 1
          fi
          xcrun stapler staple "$RUNNER_TEMP/final-mac/PowerAI-$VERSION-mac-arm64.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            "$RUNNER_TEMP/final-mac/PowerAI-$VERSION-mac-arm64.dmg"

      - name: Stage only the macOS assets
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          # Staging tooling comes from THIS repo, not from the release's own
          # desktop commit: the finalizer must behave the same for every
          # pending release, including ones built before it was written.
          node scripts/macos-release.mjs prepare "$RUNNER_TEMP/final-mac" "$RUNNER_TEMP/release-assets" "$VERSION"
          # Stapling rewrote the disk image after electron-builder measured it.
          node scripts/macos-release.mjs sync-dmg "$RUNNER_TEMP/release-assets" "$VERSION"
          node scripts/macos-release.mjs verify "$RUNNER_TEMP/release-assets" "$VERSION"

      - name: Publish only after byte-for-byte verification
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pending.outputs.tag }}
          VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-assets"/* --clobber
          mkdir -p "$RUNNER_TEMP/remote-check"
          while IFS= read -r file; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$file")" --dir "$RUNNER_TEMP/remote-check"
          done < <(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | sort)
          (cd "$RUNNER_TEMP/release-assets" && shasum -a 256 * | sort -k2) > "$RUNNER_TEMP/local-hashes.txt"
          (cd "$RUNNER_TEMP/remote-check" && shasum -a 256 * | sort -k2) > "$RUNNER_TEMP/remote-hashes.txt"
          diff -u "$RUNNER_TEMP/local-hashes.txt" "$RUNNER_TEMP/remote-hashes.txt"
          for name in PowerAI-app-pending.zip notary-state.json notary-log.json; do
            asset_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"$name\") | .id")"
            if [ -n "$asset_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; fi
          done
          # Only the notes change. The Windows lane already set this release's
          # prerelease flag and latest pointer correctly when it published;
          # re-asserting either here would hand "latest" to whichever release
          # happens to finish notarization last, which is not the newest one.
          if [[ "$VERSION" == *-* ]]; then
            printf 'PowerAI %s DEV build (prerelease). Only clients that opted into prerelease updates receive it. macOS arm64 is signed and notarized; the Windows installer is unsigned.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          else
            printf 'PowerAI %s stable release — every client receives it through automatic updates. macOS arm64 is signed and notarized; the Windows installer is unsigned.\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
