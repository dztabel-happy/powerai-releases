name: Test Swap Helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-swap-helper:
    name: Verify swap helper spawn recipe on Windows
    runs-on: windows-2025
    environment: release
    timeout-minutes: 15
    steps:
      - name: Checkout exact desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dztabel-happy/powerai-desktop
          ref: main
          ssh-key: ${{ secrets.POWERAI_DESKTOP_DEPLOY_KEY }}
          path: powerai-desktop
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Run the swap-helper variant matrix
        shell: pwsh
        run: bun powerai-desktop/tests/manual/swap-helper/verify.mjs
