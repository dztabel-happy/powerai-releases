name: Build Windows installer
description: Compile the checked-out Agent and package it with Desktop for the selected Windows architecture.
inputs:
  arch:
    description: Windows target architecture
    required: true
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Build native agent
      shell: bash
      run: |
        bun install --cwd powerai-agent --filter './packages/opencode' --filter './packages/app' --frozen-lockfile
        bun run --cwd powerai-agent/packages/opencode build -- --single --skip-install

    - name: Install desktop dependencies
      shell: bash
      run: bun install --cwd powerai-desktop --frozen-lockfile

    - name: Prepare checksum-verified Electron distribution
      shell: bash
      run: |
        electron_dist="$(cd powerai-desktop && node scripts/release/prepare-electron.mjs win32 ${{ inputs.arch }} "$RUNNER_TEMP/electron")"
        echo "ELECTRON_DIST_PATH=$electron_dist" >> "$GITHUB_ENV"

    - name: Build unsigned Windows installer
      working-directory: powerai-desktop
      env:
        CI: "true"
        CSC_IDENTITY_AUTO_DISCOVERY: "false"
        NODE_OPTIONS: --max-old-space-size=6144
      shell: pwsh
      run: bun run build-win:${{ inputs.arch }}
